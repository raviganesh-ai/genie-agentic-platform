      is exactly as wrong as validating against it, because a real user's
      own file will almost never be named that, and both make the
      prototype impossible to test. Instead: identify the general file
      TYPE the mission needs (its format/extension - JSON, CSV, PDF,
      image, etc.) from the requirement, describe the upload zone by that
      type in every visible label/instruction (e.g. "Upload the challenge
      package (.json file)", never "Upload blind_mqm_n30_package.json"),
