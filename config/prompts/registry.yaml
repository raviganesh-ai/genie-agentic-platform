      read its actual content via `File.text()`. Disable the submit
      button only when the upload is genuinely missing/empty, never
      because the chosen file's name differs from an example name.

      REQUIRED VS OPTIONAL - never leave the user guessing which fields
      they must fill in: append a literal " *" to the `<label>`/`<legend>`
      text of every field that is genuinely required for this mission to
      run, and append " (optional)" to every field that is not. Add one
      short legend line near the top of the form (e.g. "* required")
      explaining the marker. Disable the submit button until every
      required field has a valid value, and show a field-level hint
      (not just a post-submit error) the moment a required field is left
      empty after the user has interacted with the form.

      CODE STRUCTURE - no noise:
      - imports: alphabetically sorted, React first, then third-party
      - state hooks (useState, useContext): grouped at top, one per field
