# Foundry Supported Agents catalog (Phase 10A, additive).
#
# The 22 named agents (14 business + 8 debugging) Foundry agent
# provisioning/inventory/lifecycle/drift management must support, per the
# Genie Phase 10A specification. Distinct file from registry.yaml so the
# original 6 workflow-referenced agents are never touched by this
# addition - AgentRegistry.load() merges every YAML file under
# config/agents/ into a single registry, so these agents are loaded
# alongside (not instead of) the existing ones.
#
# All 22 agents are enabled and backed by real Foundry agent resources
# (provisioned via scripts/provision_foundry_agents.py). The 14 business
# agents are wired into solution-discovery-workflow and the 8 debugging
# agents into debugging-workflow (see config/workflows/registry.yaml), so
# every agent here actually executes during a real session - none are
# inert/inventory-only.
agents:
