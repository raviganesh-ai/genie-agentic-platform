  - id: discovery-persona-extraction-v1
    name: Discovery People Extraction
    description: Lists the human individuals explicitly named across the selected evidence.
    template: >-
      Inspect all source material, including OCR text, tables, visual descriptions,
      diagrams, and charts, and list every unique human individual explicitly named in
      that evidence. Copy each person's name exactly as it appears. Return only valid JSON
      in exactly this shape: {{"people":[{{"name":"Full Name"}}]}}. Each people item must
      contain only the name field. Do not analyze anyone's situation or return roles,
      descriptions, pain points, evidence references, confidence scores, IDs, or other
      fields at this stage. Do not return role archetypes, titles, stakeholder groups,
      teams, organizations, products, or hypothetical users. If no human individual is
      explicitly named, return {{"people":[]}}. Never invent a name or substitute labels
      such as "Claims Reviewer", "Customer", "Business User", or "Operations".

      Source material:
      {source_material}
    variables:
      - source_material
    version: "4.0.0"

  - id: discovery-persona-deep-dive-v1
    name: Discovery Persona Deep Dive
    description: Finds selected personas' pain points, risks, contradictions, gaps, and questions.
    template: >-
      Search the complete source material, including text, OCR, tables, visual descriptions,
      diagrams, and charts, for content explicitly spoken, written, or otherwise attributed
      to the selected person or people. Analyze only that attributable content to establish
      their stated situations, problems, pain points, desired outcomes, dependencies,
      constraints, and success measures. Do not assign another person's statements, general
      document claims, or unattributed content to the selected people. Keep each person's
      statements attributable by name when more than one person is selected. Evaluate operational,
      security, privacy, compliance, adoption, delivery, data-quality, and integration risks
      only where the selected people's attributable evidence supports them. Identify
      contradictions in their attributable evidence instead of choosing one version.
      Return only valid JSON in exactly this shape, with no additional fields:
      {{"deep_dive_findings":["Finding attributable to Person Name"],"gap_analysis":
      {{"known_facts":[],"risks":[],"contradictions":[],"information_gaps":[],
      "assumptions":[],"evidence_references":[],"confidence_score":0.0}},"questions":
      [{{"id":"stable-question-id","text":"Question text","category":"category",
      "status":"pending","evidence_references":[]}}]}}. gap_analysis must contain
      known_facts, risks, contradictions, information_gaps, assumptions,
      evidence_references, and a confidence_score from 0 to 1. Keep facts,
      risks, contradictions, assumptions, and unknowns separate. Every factual finding and
      risk must be traceable to evidence attributable to a selected person; label
      inferences as assumptions. If the evidence names someone selected but contains no
      substantive statement attributable to them, state that limitation as a finding and information gap
      instead of borrowing another person's content. questions must be an array where every
      object contains id, text, category, status set to pending, and empty evidence_references;
      omit answer and recommendation. Ask the smallest set of high-value questions needed to
      resolve contradictions, close material gaps, and recommend an implementable solution.
      Do not invent customer facts.

      Selected people:
      {selected_persona}

      Source material:
      {source_material}
    variables:
      - selected_persona
      - source_material
    version: "4.1.0"

  - id: discovery-best-practice-recommendation-v1
    name: Discovery Best Practice Recommendation
    description: Supplies a consented Microsoft and Azure best-practice answer.
    template: >-
      The user explicitly consented to a best-practice recommendation for the skipped
      question below. Return only valid JSON containing recommendation and
      evidence_references. Clearly distinguish an industry or Microsoft/Azure best practice
      from a known customer fact. Be specific enough for architecture decisions and do not
      claim undocumented Azure capabilities.

      Question:
      {question}

      Discovery context:
      {discovery_context}
    variables:
      - question
      - discovery_context
    version: "1.0.0"

  - id: discovery-probable-solutions-v1
    name: Discovery Probable Solutions
    description: Produces comparable, build-ready Azure-native solution options.
    template: >-
      Propose one to three implementable Azure-native solutions grounded in the Discovery
      context and complete source material. Use known facts and user-approved recommendations;
      do not convert unresolved gaps, contradictions, or unapproved assumptions into facts.
      Each option must address the customer's desired outcomes and material risks, expose
      meaningful tradeoffs, and trace its major decisions to evidence. Return only valid JSON
      with a top-level solutions array.
      Every solution must contain id, name, summary, requirements_text, architecture_text,
      architecture_nodes, architecture_edges, pros, cons, ai_feasibility,
      ai_feasibility_rationale, evidence_references, and pricing_queries. evidence_references
      must identify the customer evidence or approved recommendation supporting the option's
      requirements and architecture decisions. ai_feasibility must be recommended,
      feasible_with_tradeoffs, or not_feasible. Each architecture node must contain id,
      service_name, azure_icon_key, purpose, x, and y. Each edge must contain id, source,
      target, and label. Use only
      real Azure service names; the UI maps those names to an allowlisted official icon.
      requirements_text must use [REQ-001] style identifiers and include every approved
      capability under the normal requirement-category headings plus a Critical path section.
      architecture_text must follow the existing Architecture Designer contract exactly: a
      "## Single-Page UI Design" section with one top-level "**Zone name**:" bullet per
      concrete input zone and a "## Multi-Agent Workflow" section with one top-level
      "**Agent name**:" bullet per agent, including exactly one Orchestrator Agent. Every
      bullet must cite the requirement ids it fulfills. This text is sent unchanged to the
      existing Build Agent, so do not replace it with an Azure infrastructure summary.
      pricing_queries may contain only service_name, arm_region_name, sku_name,
      units_per_month, and assumption. Never provide prices: Genie resolves every unit price
      deterministically from the Azure Retail Prices API and reports missing coverage.

      Discovery context:
      {discovery_context}

      Source material:
      {source_material}
    variables:
      - discovery_context
      - source_material
    version: "2.0.0"


