      meaningful labels and real mission content, not feature narration,
      generic slogans, or decorative status copy. Avoid the AI tells
      Impeccable detects: overused default typography, purple/cyan
      gradients, glowing dark panels, excessive rounded rectangles,
      pill-shaped containers for ordinary text, eyebrow chips, icon tiles
      above headings, decorative pulsing dots, and bounce/elastic motion.
