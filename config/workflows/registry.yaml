# Workflow registry manifest.
#
# Defines the ordered collaboration steps agents follow for the Genie
# Mission Control experience described in docs/GENIE_BUILD_SPEC.md.
# Workflow execution (the orchestration engine) is implemented in Phase 6;
# this registry only describes *what* workflows exist.
#
# solution-discovery-workflow was trimmed down (post Phase-10A) to the
# single, dynamic Requirement -> Architecture -> Build -> Peer Review
# mission: every business/debugging agent that was previously wired in
# from the now-deleted config/agents/foundry_agents_catalog.yaml has been
# removed. Each step below now invokes the real, independently
# provisioned Foundry "genie-orchestrator" agent (config/agents/registry.
# yaml) instead of the step's underlying specialist directly:
# genie-orchestrator itself calls exactly one of its own call_<agent>
# delegation tools (restricted per step via allowed_tool_names, see
# app.agents.tools.orchestration_tools) to execute that phase's real
# specialist, then returns that specialist's output verbatim as the
# step's own output_text. The wave engine below still owns dependency
# ordering, parallelism, and the approval checkpoints exactly as before -
# only *which agent is invoked per step* changed, from the specialist
# directly to genie-orchestrator delegating to that same specialist.
#
# Deploy & Launch is deliberately NOT a workflow step: it is a separate,
# real (non-LLM-narrative) multi-step Azure provisioning pipeline - see
# app.deployment.pipeline_service - triggered via its own API once the
# final-output-approval checkpoint below has been confirmed on the Peer
# Review page.
#
# Every step below has a `variable_sources` mapping so the whole graph can
# run automatically from nothing but an uploaded call transcript/recording:
# 'transcript' resolves to the session's combined transcribed text,
# 'step:<id>' resolves to that already-completed step's output. Variables
# Variables that should never be auto-derived from a transcript
# (build-solution's and peer-review's `policies`,
# failure-diagnosis-v1's `failure_details`) are deliberately left unmapped -
# they still require an explicit step_inputs override, per
# app.workflows.models.WorkflowStep.variable_sources's fail-closed contract.
#
# `requires_approval_checkpoint` gates the Mission Control UI's guided,
# linear flow (Upload -> Requirements -> Architecture -> UI & Agent Design
# -> Peer Review -> Deploy & Launch) using the checkpoints already
# defined in config/policies/approval_policy.yaml: the run pauses (status
# `waiting_for_approval`) immediately BEFORE the gated step executes, so a
# human reviews/edits that step's upstream output before the mission
# continues. requirement-discovery-approval gates design-architecture (the
# human reviews/adds/removes discovered requirements before architecture is
# designed); architecture-approval gates build-solution (the human approves
# the recommended architecture before UI + agent-flow code is generated);
# final-output-approval is confirmed directly on the Peer Review page (not
# tied to any workflow step) and enforced by the Deploy & Launch pipeline's
# own start endpoint before any real Azure provisioning begins.
workflows:
  - id: solution-discovery-workflow
    name: Solution Discovery Workflow
    description: >-
      End-to-end mission from ingested customer input through requirement
      discovery, architecture recommendation, UI/multi-agent-flow build,
      and independent peer review, ready for the separate Deploy & Launch
      pipeline once approved.
    steps:
      - id: analyze-requirements
        agent_id: genie-orchestrator
        description: Extract requirements, risks, assumptions, and constraints.
        depends_on: []
        prompt_id: orchestrator-requirements-phase-v1
        allowed_tool_names:
          - call_requirements_analyst
        variable_sources:
          transcript_excerpt: transcript

      - id: design-architecture
        agent_id: genie-orchestrator
        description: Propose a multi-agent workflow and UI design for this mission's requirements.
        depends_on:
          - analyze-requirements
        prompt_id: orchestrator-architecture-phase-v1
        allowed_tool_names:
          - call_architecture_designer
        requires_approval_checkpoint: requirement-discovery-approval
        required_memory_references:
          - analyze-requirements
        variable_sources:
          approved_requirements: step:analyze-requirements

      - id: build-solution
        agent_id: genie-orchestrator
        description: >-
          Generate the customer-facing UI code and the dedicated
          multi-agent workflow design for the approved requirement and
          architecture.
        depends_on:
          - design-architecture
        prompt_id: orchestrator-build-phase-v1
        allowed_tool_names:
          - call_build_agent
        requires_approval_checkpoint: architecture-approval
        required_memory_references:
          - analyze-requirements
          - design-architecture
        variable_sources:
          requirements: step:analyze-requirements
          architecture: step:design-architecture

      - id: security-assessment
        agent_id: genie-orchestrator
        description: >-
          Perform a full regression security assessment (OWASP Top 10) of
          the generated build and report a pass/fail security gate
          verdict with findings for the Peer Review Agent to
          consolidate.
        depends_on:
          - build-solution
        prompt_id: orchestrator-security-assessment-phase-v1
        allowed_tool_names:
          - call_security_assessment_agent
        # Gates entry into the whole automated peer-review phase (this step
        # and test-generation share the same wave - see _compute_waves in
        # app/orchestration/workflow_runtime.py - so blocking this one step
        # on approval blocks test-generation too, until the Workshop page's
        # "Proceed to Peer Review" action approves it): the user must review
        # the Build Agent's generated code on the Workshop page first,
        # rather than security-assessment/test-generation/peer-review
        # kicking off automatically the instant build-solution finishes.
        requires_approval_checkpoint: build-review-approval
        required_memory_references:
          - build-solution
        variable_sources:
          artifact: step:build-solution

      - id: test-generation
        agent_id: genie-orchestrator
        description: >-
          Generate unit, integration, and UI test cases covering the
          generated build and report a pass/fail test-coverage gate
          verdict for the Peer Review Agent to
          consolidate.
        depends_on:
          - build-solution
        prompt_id: orchestrator-test-generation-phase-v1
        allowed_tool_names:
          - call_test_generation_agent
        required_memory_references:
          - analyze-requirements
          - build-solution
        variable_sources:
          artifact: step:build-solution
          requirements: step:analyze-requirements

      - id: peer-review
        agent_id: genie-orchestrator
        description: >-
          Peer Review: review the build for policy compliance, assess its
          security posture, provision/record the access control needed
          for it to run safely, and consolidate the Security Assessment
          Agent's and Test Generation Agent's findings with its own
          architecture and code-quality review into one gate verdict.
        depends_on:
          - build-solution
          - security-assessment
          - test-generation
        prompt_id: orchestrator-peer-review-phase-v1
        allowed_tool_names:
          - call_peer_review_agent
        # Peer Review reviews everything produced so far, not just the build
        # artifact: this fails closed unless the requirements and
        # architecture findings are also already present in Shared
        # Collaboration Memory, even though only `artifact`, `security_findings`,
        # and `test_plan` are substituted into the peer-review-agent's own
        # prompt text below.
        required_memory_references:
          - analyze-requirements
          - design-architecture
          - build-solution
          - security-assessment
          - test-generation
        variable_sources:
          artifact: step:build-solution
          security_findings: step:security-assessment
          test_plan: step:test-generation
    enabled: true

  - id: debugging-workflow
    name: Debugging Workflow
    description: >-
      Diagnoses a detected workflow or agent execution failure
      (FailureDetected) via the Azure-hosted debugging agent, executed
      through the same AzureAgentGateway path as every other workflow.
    steps:
      - id: diagnose-failure
        agent_id: debugging-agent
        description: Diagnose the detected failure and recommend remediation.
        depends_on: []
        prompt_id: failure-diagnosis-v1
    enabled: true
