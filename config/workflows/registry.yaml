# Workflow registry manifest.
#
# Defines the ordered collaboration steps agents follow for the Genie
# Mission Control experience described in docs/GENIE_BUILD_SPEC.md.
# Workflow execution (the orchestration engine) is implemented in Phase 6;
# this registry only describes *what* workflows exist.
#
# solution-discovery-workflow was trimmed down (post Phase-10A) to the
# single, dynamic Requirement -> Architecture -> Build -> Deploy & Launch
# mission: every business/debugging agent that was previously wired in
# from the now-deleted config/agents/foundry_agents_catalog.yaml has been
# removed. Each step below now invokes the real, independently
# provisioned Foundry "genie-orchestrator" agent (config/agents/registry.
# yaml) instead of the step's underlying specialist directly:
# genie-orchestrator itself calls exactly one of its own call_<agent>
# delegation tools (restricted per step via allowed_tool_names, see
# app.agents.tools.orchestration_tools) to execute that phase's real
# specialist, then returns that specialist's output verbatim as the
# step's own output_text. The wave engine below still owns dependency
# ordering and parallelism - only *which agent is invoked per step*
# changed, from the specialist directly to genie-orchestrator delegating
# to that same specialist.
#
# Deploy & Launch is deliberately NOT a workflow step: it is a separate,
# real (non-LLM-narrative) multi-step Azure provisioning pipeline - see
# app.deploy_launch.pipeline_service - started directly from the Deploy &
# Launch page once the human clicks Start. Test generation (and its real
# execution) also happens there now, as the pipeline's own
# generate-test-suite/execute-test-suite steps AFTER the app is actually
# deployed - not as a discovery-workflow step - so the generated tests
# cover the real, deployed build rather than a pre-deploy narrative pass.
#
# Every step below has a `variable_sources` mapping so the whole graph can
# run automatically from nothing but an uploaded call transcript/recording:
# 'transcript' resolves to the session's combined transcribed text,
# 'step:<id>' resolves to that already-completed step's output. Variables
# Variables that should never be auto-derived from a transcript
# (build-solution's `policies`/`excluded_agents`, failure-diagnosis-v1's
# `failure_details`) are deliberately left unmapped - they still require
# an explicit step_inputs override, per
# app.workflows.models.WorkflowStep.variable_sources's fail-closed contract.
#
# Genie's own Mission Control flow is deliberately just four independent,
# human-paced stages: Requirements -> Architecture -> Code -> Deploy &
# Launch. Each stage's result is persisted as soon as it completes; moving
# to the next stage happens only when the human clicks Proceed. This is a
# plain structural pause (`requires_human_proceed` on
# `app.workflows.models.WorkflowStep`) - the run simply stops with status
# `waiting_for_proceed` until a resume call explicitly targets that next
# step's id in its `step_inputs`; there is no separate ApprovalRequest to
# create/decide/reject (see `requires_approval_checkpoint`, which stays
# supported by the runtime for other workflows/governance use cases but is
# unused here). Revisiting/editing an earlier, already-persisted stage
# never cascades into automatically re-running a downstream stage - the
# human decides when to re-run anything.
workflows:
  - id: solution-discovery-workflow
    name: Solution Discovery Workflow
    description: >-
      End-to-end mission from ingested customer input through requirement
      discovery, architecture recommendation, and UI/multi-agent-flow
      build, ready for the separate Deploy & Launch pipeline once
      approved. Test generation happens later, inside that Deploy &
      Launch pipeline, once the build is actually deployed.
    steps:
      - id: analyze-requirements
        agent_id: genie-orchestrator
        description: Extract requirements, risks, assumptions, and constraints.
        depends_on: []
        prompt_id: orchestrator-requirements-phase-v1
        allowed_tool_names:
          - call_requirements_analyst
        variable_sources:
          transcript_excerpt: transcript

      - id: design-architecture
        agent_id: genie-orchestrator
        description: Propose a multi-agent workflow and UI design for this mission's requirements.
        depends_on:
          - analyze-requirements
        prompt_id: orchestrator-architecture-phase-v1
        requires_human_proceed: true
        allowed_tool_names:
          - call_architecture_designer
        required_memory_references:
          - analyze-requirements
        variable_sources:
          approved_requirements: step:analyze-requirements

      - id: build-solution
        agent_id: genie-orchestrator
        description: >-
          Generate the customer-facing UI code and the dedicated
          multi-agent workflow design for the approved requirement and
          architecture.
        depends_on:
          - design-architecture
        prompt_id: orchestrator-build-phase-v1
        requires_human_proceed: true
        allowed_tool_names:
          - call_build_agent
        required_memory_references:
          - analyze-requirements
          - design-architecture
        variable_sources:
          # Use the exact human-reviewed text submitted by Requirements'
          # existing "Proceed to Architecture" action. Falling back to the
          # analyst's original prose here silently discarded user edits and
          # let prototype scope diverge from what the user approved.
          requirements: step-variable:design-architecture:approved_requirements
          architecture: step:design-architecture
          # Resolves to the real, live Foundry model catalog (the same
          # list Genie's own Landing page model picker uses - see
          # app.services.model_catalog_service.ModelCatalogService) so the
          # Build Agent can offer a genuine model-selection dropdown in
          # generated UI/config code instead of inventing fake model-ID
          # strings like "gpt-4o-primary" that reference nothing real. See
          # WorkflowStepExecutor._resolve_variables's "model-catalog" source.
          available_models: model-catalog
          # Self-referential: on a retried attempt (see
          # WorkshopPage.tsx's "Re-run UI & Agent Design" ->
          # workflowApi.resumeRun), this resolves to THIS SAME step's own
          # prior attempt output (workflow_runtime.run_workflow keeps a
          # failed step's own WorkflowStepResult in step_results/step_outputs
          # precisely so a resumed run can read it back here - see
          # WorkflowStepExecutor._resolve_variables/_read_step_output).
          # call_build_agent's _generate_build_by_component parses this to
          # skip regenerating any component that already succeeded last
          # time, instead of unconditionally regenerating the entire build
          # from scratch on every retry. Empty on a run's first attempt
          # (no prior output exists yet), which is exactly the "nothing to
          # reuse" case that function already handles.
          previous_build_output: step:build-solution

    enabled: true

  - id: debugging-workflow
    name: Debugging Workflow
    description: >-
      Diagnoses a detected workflow or agent execution failure
      (FailureDetected) via the Azure-hosted debugging agent, executed
      through the same AzureAgentGateway path as every other workflow.
    steps:
      - id: diagnose-failure
        agent_id: debugging-agent
        description: Diagnose the detected failure and recommend remediation.
        depends_on: []
        prompt_id: failure-diagnosis-v1
    enabled: true
