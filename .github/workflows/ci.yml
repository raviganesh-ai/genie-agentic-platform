name: CI

# The repo's actual default branch is "master" (verify with `git branch -a`
# before ever changing this back to "main" - CI silently never ran on any
# push/PR until this was fixed, since the previous trigger watched a branch
# that doesn't exist in this repo).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check app tests

      - name: Test (pytest)
        run: python -m pytest -v

  frontend:
    name: Frontend (typecheck + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  gateway:
    name: Gateway (.NET build + test)
    runs-on: ubuntu-latest
    env:
      VSS_NUGET_EXTERNAL_FEED_ENDPOINTS: >-
        {"endpointCredentials":[{"endpoint":"https://pkgs.dev.azure.com/MicrosoftIT/OneITVSO/_packaging/PS-GCM-FieldExperiencePlatform/nuget/v3/index.json","username":"AzureDevOps","password":"${{ secrets.AZURE_DEVOPS_TOKEN }}"}]}
    steps:
      - uses: actions/checkout@v4

      - name: Check MISE feed credential
        run: |
          if [ -z "${{ secrets.AZURE_DEVOPS_TOKEN }}" ]; then
            echo "::error::Missing AZURE_DEVOPS_TOKEN with MicrosoftIT Packaging Read access."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Azure Artifacts Credential Provider
        run: sh -c "$(curl -fsSL https://aka.ms/install-artifacts-credprovider.sh)"

      - name: Restore gateway
        run: >-
          dotnet restore
          gateway/Genie.AuthenticationGateway.Tests/Genie.AuthenticationGateway.Tests.csproj
          --configfile gateway/NuGet.config

      - name: Build gateway
        run: >-
          dotnet build
          gateway/Genie.AuthenticationGateway.Tests/Genie.AuthenticationGateway.Tests.csproj
          --configuration Release
          --no-restore

      - name: Test gateway
        run: >-
          dotnet test
          gateway/Genie.AuthenticationGateway.Tests/Genie.AuthenticationGateway.Tests.csproj
          --configuration Release
          --no-build

  # Deploy jobs only run on a real push to master (never on a PR from a
  # fork, and never unless both CI jobs above already passed) - see
  # "Continuous deployment" in README.md for the one-time Azure setup
  # (federated OIDC credential + RBAC) required before these can succeed.
  deploy-backend:
    name: Deploy backend + gateway (Container Apps)
    needs: [backend, frontend, gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    # Safety net: if a step ever hangs (e.g. a CLI retrying on missing/
    # invalid credentials) this bounds the wasted runner minutes instead of
    # running until the default 6h job timeout.
    timeout-minutes: 15
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a clear message when the required Azure OIDC secrets
      # have not been configured yet, instead of letting azure/login@v2 (or
      # a later az CLI call) fail/hang with a confusing error.
      - name: Check required secrets
        run: |
          missing=()
          [ -z "${{ secrets.AZURE_CLIENT_ID }}" ] && missing+=("AZURE_CLIENT_ID")
          [ -z "${{ secrets.AZURE_TENANT_ID }}" ] && missing+=("AZURE_TENANT_ID")
          [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ] && missing+=("AZURE_SUBSCRIPTION_ID")
          [ -z "${{ secrets.AZURE_DEVOPS_TOKEN }}" ] && missing+=("AZURE_DEVOPS_TOKEN")
          [ -z "${{ vars.AZURE_ACR_NAME }}" ] && missing+=("AZURE_ACR_NAME")
          [ -z "${{ vars.AZURE_CONTAINER_APP_NAME }}" ] && missing+=("AZURE_CONTAINER_APP_NAME")
          [ -z "${{ vars.AZURE_RESOURCE_GROUP }}" ] && missing+=("AZURE_RESOURCE_GROUP")
          [ -z "${{ vars.VITE_ENTRA_CLIENT_ID }}" ] && missing+=("VITE_ENTRA_CLIENT_ID")
          [ -z "${{ vars.GENIE_GATEWAY_ALLOWED_ORIGIN }}" ] && missing+=("GENIE_GATEWAY_ALLOWED_ORIGIN")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets for deploy-backend: ${missing[*]}. See README.md 'Continuous deployment' section for one-time Azure OIDC setup."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push backend image (ACR)
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "genie-backend:${{ github.sha }}" \
            --file backend/Dockerfile \
            .

      - name: Build and push authentication gateway image (ACR)
        run: |
          az acr build \
            --registry "${{ vars.AZURE_ACR_NAME }}" \
            --image "genie-auth-gateway:${{ github.sha }}" \
            --file gateway/Dockerfile \
            --secret-build-arg AZURE_DEVOPS_TOKEN="${{ secrets.AZURE_DEVOPS_TOKEN }}" \
            .

      # Both immutable images and ingress port 8080 are applied in one ARM
      # patch, so no revision can expose FastAPI directly or mix image tags.
      - name: Roll out gateway-protected Container App revision
        shell: pwsh
        run: |
          ./scripts/deploy_authentication_gateway.ps1 `
            -SubscriptionId "${{ secrets.AZURE_SUBSCRIPTION_ID }}" `
            -ResourceGroup "${{ vars.AZURE_RESOURCE_GROUP }}" `
            -ContainerAppName "${{ vars.AZURE_CONTAINER_APP_NAME }}" `
            -TenantId "${{ secrets.AZURE_TENANT_ID }}" `
            -ClientId "${{ vars.VITE_ENTRA_CLIENT_ID }}" `
            -BackendImage "${{ vars.AZURE_ACR_NAME }}.azurecr.io/genie-backend:${{ github.sha }}" `
            -GatewayImage "${{ vars.AZURE_ACR_NAME }}.azurecr.io/genie-auth-gateway:${{ github.sha }}" `
            -AllowedOrigin "${{ vars.GENIE_GATEWAY_ALLOWED_ORIGIN }}" `
            -RevisionSuffix "gh${{ github.run_number }}"

  deploy-frontend:
    name: Deploy frontend (Static Web Apps)
    needs: [backend, frontend, gateway]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    # Safety net: the swa CLI has been observed to hang (rather than fail
    # fast) when given an empty/invalid deployment token, so bound the
    # wasted runner minutes instead of running until the default 6h limit.
    timeout-minutes: 15
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Fail fast with a clear message when the deployment token has not
      # been configured yet, instead of letting the swa CLI hang on an
      # empty token (observed to not fail fast in practice).
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.SWA_DEPLOYMENT_TOKEN }}" ]; then
            echo "::error::Missing required secret SWA_DEPLOYMENT_TOKEN. See README.md 'Continuous deployment' section for one-time Azure setup."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GENIE_API_BASE_URL: ${{ vars.VITE_GENIE_API_BASE_URL }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE }}

      - name: Deploy to Azure Static Web Apps
        timeout-minutes: 5
        run: npx --yes @azure/static-web-apps-cli@latest deploy ./dist --deployment-token "${{ secrets.SWA_DEPLOYMENT_TOKEN }}" --env production

