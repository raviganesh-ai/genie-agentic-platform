# Workflow registry manifest.
#
# Defines the ordered collaboration steps agents follow for the Mission
# Control experience described in docs/GENIE_BUILD_SPEC.md. Workflow
# execution (the orchestration engine) is implemented in Phase 6; this
# registry only describes *what* workflows exist.
#
# solution-discovery-workflow was expanded (Phase 10A follow-up) to wire in
# every one of the 14 business agents from config/agents/
# foundry_agents_catalog.yaml alongside the original 6 registry.yaml agents,
# so all previously-provisioned-but-unreferenced catalog agents now actually
# execute (in real, observable collaboration waves) during a real session -
# not just appear as inert inventory entries.
workflows:
  - id: solution-discovery-workflow
    name: Solution Discovery Workflow
    description: >-
      End-to-end discovery flow from ingested customer input through
      architecture recommendation, enrichment, governance approval, and
      an executive-ready summary - now spanning all 20 business/governance
      agents in the catalog.
    steps:
      # --- Wave 0: initial discovery -----------------------------------
      - id: discover-inputs
        agent_id: discovery-agent
        description: Lead initial customer discovery across ingested inputs.
        depends_on: []
        prompt_id: business-agent-workshop-v1
      - id: facilitate-workshop
        agent_id: workshop-facilitator-agent
        description: Facilitate the interactive customer workshop experience.
        depends_on: []
        prompt_id: business-agent-workshop-v1

      # --- Wave 1: requirements capture ---------------------------------
      - id: analyze-requirements
        agent_id: requirements-analyst
        description: Extract requirements, risks, assumptions, and constraints.
        depends_on:
          - discover-inputs
        prompt_id: requirements-extraction-v1
      - id: capture-requirements-detail
        agent_id: requirements-agent
        description: Capture and structure functional and non-functional requirements.
        depends_on:
          - discover-inputs
        prompt_id: business-agent-workshop-v1

      # --- Wave 2: industry context + risk -------------------------------
      - id: apply-industry-patterns
        agent_id: industry-expert-agent
        description: Supply industry-specific patterns and best practices.
        depends_on:
          - analyze-requirements
          - capture-requirements-detail
        prompt_id: business-agent-workshop-v1
      - id: assess-risk
        agent_id: risk-assessor
        description: Score business, technical, and compliance risk.
        depends_on:
          - analyze-requirements
          - capture-requirements-detail
        prompt_id: risk-assessment-v1
      - id: assess-risk-compliance
        agent_id: risk-compliance-agent
        description: Assess regulatory, compliance, and business risk.
        depends_on:
          - analyze-requirements
          - capture-requirements-detail
        prompt_id: business-agent-workshop-v1

      # --- Wave 3: architecture design -----------------------------------
      - id: design-architecture
        agent_id: architecture-designer
        description: Propose an Azure reference architecture with rationale.
        depends_on:
          - apply-industry-patterns
        prompt_id: architecture-recommendation-v1
      - id: design-data-architecture
        agent_id: data-architect-agent
        description: Design data architecture and integration patterns.
        depends_on:
          - apply-industry-patterns
        prompt_id: business-agent-workshop-v1

      # --- Wave 4: end-to-end solution architecture -----------------------
      - id: design-solution-architecture
        agent_id: solution-architect-agent
        description: Produce an end-to-end Azure solution architecture.
        depends_on:
          - design-architecture
          - design-data-architecture
        prompt_id: business-agent-workshop-v1

      # --- Wave 5: parallel enrichment of the solution --------------------
      - id: propose-innovation
        agent_id: innovation-agent
        description: Propose innovative or emerging-technology alternatives.
        depends_on:
          - design-solution-architecture
        prompt_id: business-agent-workshop-v1
      - id: design-ui
        agent_id: ui-designer-agent
        description: Design interactive UI/UX concepts for the proposed solution.
        depends_on:
          - design-solution-architecture
        prompt_id: business-agent-workshop-v1
      - id: optimize-cost
        agent_id: cost-optimization-agent
        description: Evaluate and recommend Azure cost optimizations.
        depends_on:
          - design-solution-architecture
        prompt_id: business-agent-workshop-v1
      - id: review-responsible-ai
        agent_id: responsible-ai-agent
        description: Review the proposed solution for responsible AI considerations.
        depends_on:
          - design-solution-architecture
        prompt_id: business-agent-workshop-v1
      - id: build-roadmap
        agent_id: roadmap-agent
        description: Build a phased delivery roadmap from the proposed architecture.
        depends_on:
          - design-solution-architecture
        prompt_id: business-agent-workshop-v1

      # --- Wave 6: governance approval gate --------------------------------
      - id: governance-review
        agent_id: governance-reviewer
        description: Review discovery and architecture outputs for approval.
        depends_on:
          - assess-risk
          - assess-risk-compliance
          - design-solution-architecture
        prompt_id: governance-review-v1
        requires_approval_checkpoint: architecture-approval

      # --- Wave 7: cross-cutting governance coordination --------------------
      - id: coordinate-governance
        agent_id: governance-agent
        description: Coordinate cross-cutting governance policy checks.
        depends_on:
          - governance-review
          - propose-innovation
          - design-ui
          - optimize-cost
          - review-responsible-ai
          - build-roadmap
        prompt_id: business-agent-workshop-v1

      # --- Wave 8: executive summary / final output gate ---------------------
      - id: summarize-executive
        agent_id: executive-summary-agent
        description: Produce an executive-ready summary of session outcomes.
        depends_on:
          - coordinate-governance
        prompt_id: business-agent-workshop-v1
        requires_approval_checkpoint: final-output-approval
    enabled: true

  - id: debugging-workflow
    name: Debugging Workflow
    description: >-
      Diagnoses a detected workflow or agent execution failure
      (FailureDetected) via the Azure-hosted debugging agent, executed
      through the same AzureAgentGateway path as every other workflow. The 8
      specialist debugging agents from the Foundry Supported Agents catalog
      now run alongside the generic debugging-agent in parallel, each
      diagnosing from its own domain angle, followed by a final synthesis
      step that produces one consolidated remediation recommendation.
    steps:
      - id: diagnose-failure
        agent_id: debugging-agent
        description: Diagnose the detected failure and recommend remediation.
        depends_on: []
        prompt_id: failure-diagnosis-v1
      - id: diagnose-test-failure
        agent_id: test-failure-analyst-agent
        description: Diagnose automated test failures across the platform.
        depends_on: []
        prompt_id: failure-diagnosis-v1
      - id: diagnose-backend-failure
        agent_id: backend-debugging-agent
        description: Diagnose backend service and API execution failures.
        depends_on: []
        prompt_id: failure-diagnosis-v1
      - id: diagnose-frontend-failure
        agent_id: frontend-debugging-agent
        description: Diagnose frontend rendering and interaction failures.
        depends_on: []
        prompt_id: failure-diagnosis-v1
      - id: diagnose-orchestration-failure
        agent_id: agent-orchestration-debugging-agent
        description: Diagnose workflow orchestration and handoff failures.
        depends_on: []
        prompt_id: failure-diagnosis-v1
      - id: diagnose-security-failure
        agent_id: security-debugging-agent
        description: Diagnose authentication, authorization, and security failures.
        depends_on: []
        prompt_id: failure-diagnosis-v1
      - id: diagnose-deployment-failure
        agent_id: azure-deployment-debugging-agent
        description: Diagnose Azure infrastructure and deployment failures.
        depends_on: []
        prompt_id: failure-diagnosis-v1
      - id: diagnose-governance-trace-failure
        agent_id: governance-trace-debugging-agent
        description: Diagnose governance/decision lineage recording failures.
        depends_on: []
        prompt_id: failure-diagnosis-v1
      - id: diagnose-memory-failure
        agent_id: memory-debugging-agent
        description: Diagnose memory read/write/promotion failures.
        depends_on: []
        prompt_id: failure-diagnosis-v1
    enabled: true

