    name: Discovery Agent
    role: discovery
    description: Leads initial customer discovery across ingested inputs.
    capabilities: [transcript_analysis]
    allowed_tools: [azure_ai_search]
    memory_access: [personal, shared]
    foundry_agent_id: asst_3mtWPqHXnZ9udxNAocBNr8cr
    owner: requirements-team
    governance_policy_id: standard-governance-policy-v1
    prompt_template_ref: business-agent-workshop-v1
    enabled: true

