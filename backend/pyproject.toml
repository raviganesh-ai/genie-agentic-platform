[project]
name = "genie-backend"
version = "1.0.0"
description = "Genie Agentic Experience Center backend (Phase 1: repository foundation, configuration, and fail-closed startup validation)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyyaml>=6.0,<7.0",
    "azure-ai-projects>=2.3,<3.0",
    "azure-identity>=1.17,<2.0",
    "azure-mgmt-resource>=23.0,<24.0",
    "azure-mgmt-cognitiveservices>=13.6,<14.0",
    "azure-mgmt-containerregistry>=10.3,<11.0",
    "azure-mgmt-appcontainers>=3.1,<4.0",
    "azure-mgmt-storage>=21.2,<22.0",
    "azure-mgmt-msi>=7.0,<8.0",
    "azure-mgmt-authorization>=4.0,<5.0",
    "azure-storage-blob>=12.22,<13.0",
    "agent-framework-foundry>=1.10,<2.0",
    "agent-framework-core>=1.12,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
    "pypdf>=5.0,<6.0",
    "bandit>=1.7,<2.0",
    # Not a dev-only tool here: DeploymentPipelineService's "Execute Full
    # Fledge Testing" step (see app/deploy_launch/test_execution_service.py)
    # shells out to `sys.executable -m pytest` at PRODUCTION runtime to
    # really execute each mission's generated test suite. It must be
    # installed in the deployed image itself, not just the `dev` extra
    # (which the production Dockerfile never installs) - omitting it here
    # silently made every single mission's test-execution step fail with
    # "No module named pytest", misreported as "the generated test suite
    # has no runnable test function(s)".
    "pytest>=8.2,<9.0",
    # Also not dev-only: EntraTokenValidator/LocalDevTokenValidator (see
    # app/security/token_validator.py) import this directly at request time
    # in production. It previously only worked by luck via msal's transitive
    # dependency on pyjwt (pulled in through azure-identity) - declare it
    # explicitly so it can't silently disappear on an unrelated dependency bump.
    "pyjwt[crypto]>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008 (function call in argument default) is a false positive for FastAPI's
# `Depends(...)` dependency-injection pattern, used throughout app.api/app.security.
ignore = ["B008"]
