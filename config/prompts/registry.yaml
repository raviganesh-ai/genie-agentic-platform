      IMPECCABLE DESIGN CONTRACT - apply the design methodology from
      https://impeccable.style/ to this UI, not generic AI styling. First
      infer the surface mode from the mission: operational tools optimize
      for fast scanning and repeated action; explanatory tools optimize
      for comprehension; experiential tools let the work itself lead.
      Commit to one domain-specific visual direction and clear information
      hierarchy. Use the shell's semantic utility classes (`genie-card`,
