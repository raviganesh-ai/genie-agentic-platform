# Azure resource providers required to provision and run Genie.
#
# This list is the single source of truth for deployment readiness checks
# (backend/app/deployment/) and must be kept in sync with the resources
# defined under infra/. Every entry names the Azure resource provider
# *namespace* Genie's infrastructure depends on and the reason it is
# required, so operators onboarding a brand-new (empty) Azure subscription
# can register missing providers before running `az deployment sub create`.
#
# Per the Configuration Rules in .github/copilot-instructions.md, no
# subscription id, tenant id, endpoint, or credential belongs in this file -
# only structural metadata about which provider namespaces Genie needs.
resource_providers:
  - namespace: Microsoft.Resources
    display_name: Azure Resource Manager
    reason: Required to create the resource group Genie's infrastructure lives in.
    required: true

  - namespace: Microsoft.Authorization
    display_name: Azure RBAC
    reason: Required to grant the managed identity least-privilege access to every other resource.
    required: true

  - namespace: Microsoft.ManagedIdentity
    display_name: Managed Identity
    reason: Genie's backend authenticates to every Azure service via a user-assigned managed identity.
    required: true

  - namespace: Microsoft.KeyVault
    display_name: Azure Key Vault
    reason: Stores secrets and connection material referenced by Genie's backend configuration.
    required: true

  - namespace: Microsoft.Storage
    display_name: Azure Storage
    reason: Backs transcript/recording/document ingestion and durable blob storage.
    required: true

  - namespace: Microsoft.CognitiveServices
    display_name: Azure AI Foundry
    reason: Hosts the Azure AI Foundry account and project every production agent executes through.
    required: true

  - namespace: Microsoft.Search
    display_name: Azure AI Search
    reason: Backs the Enterprise Knowledge Memory tier's vector/keyword search index.
    required: true

  - namespace: Microsoft.DocumentDB
    display_name: Cosmos DB
    reason: Durable store for Personal Agent Memory, Shared Collaboration Memory, and governance lineage.
    required: true

  - namespace: Microsoft.App
    display_name: Azure Container Apps
    reason: Hosts the Genie backend's Container Apps environment and revisions.
    required: true

  - namespace: Microsoft.Web
    display_name: Azure Static Web Apps / App Service
    reason: Hosts the Mission Control frontend (Static Web App) and/or an App Service fallback host.
    required: true

  - namespace: Microsoft.OperationalInsights
    display_name: Log Analytics
    reason: Central workspace every other resource's diagnostic logs and Application Insights telemetry flow into.
    required: true

  - namespace: Microsoft.Insights
    display_name: Application Insights / Azure Monitor
    reason: Application telemetry, distributed tracing, and OpenTelemetry export target for the backend.
    required: true

  - namespace: Microsoft.MarketplaceOrdering
    display_name: Azure Marketplace Ordering
    reason: Required to read and sign the Azure Marketplace agreement for Foundry Models from partners and community (e.g. Anthropic Claude), which Genie's agents may be configured to use.
    required: true

  - namespace: Microsoft.Marketplace
    display_name: Azure Marketplace
    reason: Required to read marketplace offer/plan agreement terms for Foundry Models from partners and community.
    required: true

  - namespace: Microsoft.SaaS
    display_name: SaaS Resource Provider
    reason: Foundry Models from partners and community (e.g. Anthropic Claude) provision a per-project SaaS subscription resource when deployed.
    required: true
